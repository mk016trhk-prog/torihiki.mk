<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>取引管理</title>
    <style>
        :root {
            --bg-color: #FAF4F7;
            --main-color: #B4495B;
            --main-light: #f3dce0;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e0b8c0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 12px; padding-bottom: 60px; }

        /* パスワード画面 */
        #auth-screen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 85vh; text-align: center;
        }
        #auth-screen h1 { color: var(--main-color); font-size: 28px; margin-bottom: 8px; }
        #auth-screen p { font-size: 13px; color: #666; margin-bottom: 20px; }
        #auth-screen input {
            padding: 12px; font-size: 16px; border: 2px solid var(--main-color);
            border-radius: 8px; margin-bottom: 12px; width: 85%; max-width: 300px; text-align: center; background: #fff;
        }
        #auth-screen button {
            background: var(--main-color); color: white; border: none; padding: 12px 30px;
            font-size: 16px; border-radius: 8px; font-weight: bold; cursor: pointer;
        }

        /* メイン画面 */
        #app-screen { display: none; max-width: 600px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px solid var(--main-color); padding-bottom: 8px; flex-wrap: wrap; gap: 6px; }
        .header-title-area { display: flex; align-items: baseline; gap: 8px; }
        header h1 { color: var(--main-color); font-size: 20px; letter-spacing: 0.5px; }
        .header-credit { font-size: 11px; color: var(--main-color); font-weight: bold; }
        .header-btns { display: flex; gap: 4px; flex-wrap: wrap; }
        .header-btns button { background: none; border: 1px solid var(--main-color); color: var(--main-color); padding: 4px 6px; border-radius: 6px; font-size: 10px; font-weight: bold; cursor: pointer; }

        /* フィルター */
        .filter-container { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
        .filter-container select, .search-box input { width: 100%; padding: 8px 10px; border: 1.5px solid var(--main-color); border-radius: 8px; font-size: 13px; background: #fff; margin-bottom: 0; }
        .filter-container select { flex: 1; min-width: 100px; }
        .search-box { margin-bottom: 12px; }

        /* タブ */
        .tabs { display: flex; gap: 6px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 4px; }
        .tab-btn {
            background: #fff; border: 1.5px solid var(--main-color); color: var(--main-color);
            padding: 8px 12px; border-radius: 20px; font-size: 13px; white-space: nowrap; font-weight: bold; cursor: pointer;
        }
        .tab-btn.active { background: var(--main-color); color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* ボタン共通 */
        .primary-btn {
            background: var(--main-color); color: white; border: none; width: 100%;
            padding: 12px; border-radius: 8px; font-size: 15px; font-weight: bold; margin-bottom: 15px; cursor: pointer;
        }
        .sub-btn {
            background: var(--main-light); color: var(--main-color); border: 1px solid var(--main-color);
            padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer;
        }
        .del-row-btn {
            background: #f5f5f5; color: #666; border: 1px solid #ccc;
            padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer;
        }
        .row-btn-group { display: flex; gap: 6px; margin-bottom: 10px; }
        .copy-btn {
            background: var(--main-light); color: var(--main-color); border: 1px solid var(--main-color);
            padding: 6px 12px; border-radius: 6px; font-size: 16px; cursor: pointer;
        }

        /* フォーム */
        .form-box { background: #fff; border: 2px solid var(--main-color); border-radius: 12px; padding: 14px; margin-bottom: 16px; }
        .form-section-title { font-size: 13px; font-weight: bold; color: var(--main-color); margin: 12px 0 6px; border-left: 4px solid var(--main-color); padding-left: 6px; }
        input[type="text"], input[type="number"], input[type="date"], select, textarea {
            width: 100%; padding: 8px 10px; margin-bottom: 8px; border: 1px solid var(--border-color);
            border-radius: 6px; font-size: 14px; background: #fff;
        }
        
        /* 行のレイアウト */
        .item-row { display: flex; gap: 4px; margin-bottom: 8px; align-items: flex-start; flex-wrap: wrap; background: #fdf8fa; padding: 6px; border-radius: 8px; border: 1px solid #f0d5dc; }
        .item-col-name { flex: 2; min-width: 110px; }
        .item-col-type { flex: 1; min-width: 70px; }
        .item-col-count { flex: 0.5; min-width: 45px; }
        .item-col-reex { flex: 1.1; min-width: 90px; }
        .item-row select, .item-row input { margin-bottom: 0; font-size: 12px; padding: 6px 4px; }

        .long-term-box { background: #fff5f7; border: 1.5px dashed var(--main-color); padding: 8px; border-radius: 8px; margin-bottom: 8px; }

        /* 取引カード */
        .trade-card {
            background: var(--card-bg); border: 1.5px solid var(--border-color); border-radius: 12px;
            padding: 12px; margin-bottom: 14px; box-shadow: 0 2px 6px rgba(180, 73, 91, 0.08);
        }
        .card-top-meta { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #777; margin-bottom: 8px; }
        .badge-container { display: flex; gap: 4px; }
        .badge-long { background: var(--main-color); color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .badge-buy { background: #8A5A68; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .badge-exchange { background: #688A5A; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .badge-calling { background: #D98880; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .badge-stock { background: #5A8A68; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        
        .partner-area { background: #fdf8fa; border: 1px solid #f0d5dc; border-radius: 8px; padding: 10px; margin-bottom: 8px; }
        .partner-id { font-weight: bold; font-size: 14px; margin-bottom: 4px; color: #222; }
        .long-date-info { font-size: 12px; color: var(--main-color); font-weight: bold; margin-bottom: 4px; }
        
        .my-area { background: #fff; border: 1.5px solid var(--main-color); border-radius: 8px; padding: 10px; margin-bottom: 8px; }
        .my-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .status-select { width: auto; padding: 4px 8px; font-size: 12px; font-weight: bold; color: var(--main-color); border: 1.5px solid var(--main-color); border-radius: 6px; margin-bottom: 0; }

        .item-list-text { font-size: 13px; line-height: 1.5; }
        .memo-display { font-size: 12px; color: #555; background: #fafafa; padding: 6px 8px; border-radius: 6px; margin-top: 6px; border: 1px dashed #ccc; }
        
        .card-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
        .action-link-btn { background: none; border: none; color: var(--main-color); font-size: 12px; text-decoration: underline; cursor: pointer; font-weight: bold; }
        .del-btn { background: none; border: none; color: #999; font-size: 11px; text-decoration: underline; cursor: pointer; }

        .option-toggle-area { margin-bottom: 12px; font-size: 13px; display: flex; align-items: center; gap: 6px; background: #fff; padding: 8px 12px; border-radius: 8px; border: 1.5px solid var(--border-color); }

        /* 集計 */
        .summary-controls { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
        .summary-controls select { flex: 1; min-width: 100px; font-size: 13px; font-weight: bold; color: var(--main-color); border: 1.5px solid var(--main-color); margin-bottom: 0; padding: 8px 10px; border-radius: 8px; background: #fff; }
        .summary-card { background: #fff; border-radius: 10px; padding: 12px; margin-bottom: 12px; border: 1px solid var(--border-color); }
        .summary-major { font-weight: bold; color: var(--main-color); font-size: 15px; border-bottom: 1px solid #eee; padding-bottom: 4px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
        .summary-genre-label { font-size: 11px; background: var(--main-light); color: var(--main-color); padding: 2px 6px; border-radius: 4px; font-weight: normal; }
        .summary-minor { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; }

        /* 定型文 */
        .template-card { background: #fff; border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
        .template-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .template-title { font-weight: bold; font-size: 14px; color: var(--main-color); }
        .template-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; background: var(--main-light); color: var(--main-color); }
        .template-body { font-size: 13px; white-space: pre-wrap; background: #fafafa; padding: 8px; border-radius: 6px; margin-bottom: 8px; border: 1px solid #eee; }
        .char-count { font-size: 11px; color: #666; text-align: right; margin-top: -4px; margin-bottom: 6px; }
        .char-count.over { color: red; font-weight: bold; }
    </style>
</head>
<body>

    <!-- パスワード認証画面 -->
    <div id="auth-screen">
        <h1>取引管理</h1>
        <p>パスワードを入力してください</p>
        <input type="password" id="pass-input" placeholder="パスワードを入力">
        <button id="login-btn">ログイン</button>
        <p id="error-msg" style="color: #B4495B; font-size: 12px; margin-top: 10px;"></p>
    </div>

    <!-- メインアプリ画面 -->
    <div id="app-screen">
        <header>
            <div class="header-title-area">
                <h1>取引管理</h1>
                <span class="header-credit">制作:みけ@mknk16n</span>
            </div>
            <div class="header-btns">
                <button onclick="exportData()" style="background:var(--main-light); font-weight:bold;">💾 バックアップ</button>
                <button onclick="triggerImport()" style="background:#e0ecf3; color:#336699; border-color:#336699; font-weight:bold;">📂 復元</button>
                <input type="file" id="import-file-input" style="display:none;" accept=".json" onchange="importData(event)">
                <button onclick="changePass()">PW変更</button>
                <button onclick="logout()">ログアウト</button>
            </div>
        </header>

        <!-- タブ切り替え -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('calling', this)">声掛中 <span id="count-calling" style="font-size:11px; opacity:0.8;">(0)</span></button>
            <button class="tab-btn" onclick="switchTab('active', this)">交換 <span id="count-active" style="font-size:11px; opacity:0.8;">(0)</span></button>
            <button class="tab-btn" onclick="switchTab('buy', this)">買取/譲渡 <span id="count-buy" style="font-size:11px; opacity:0.8;">(0)</span></button>
            <button class="tab-btn" onclick="switchTab('completed', this)">完了 <span id="count-completed" style="font-size:11px; opacity:0.8;">(0)</span></button>
            <button class="tab-btn" onclick="switchTab('stock', this)">在庫管理 <span id="count-stock" style="font-size:11px; opacity:0.8;">(0)</span></button>
            <button class="tab-btn" onclick="switchTab('summary', this)">集計</button>
            <button class="tab-btn" onclick="switchTab('templates', this)">定型文</button>
        </div>

        <!-- 共通検索・絞り込みエリア -->
        <div id="common-filter-area">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="🔍 検索..." oninput="renderAll()">
            </div>
            <div class="filter-container">
                <select id="filter-genre" onchange="onGenreFilterChange()">
                    <option value="すべて">ジャンル: すべて</option>
                </select>
                <select id="filter-product" onchange="renderAll()">
                    <option value="すべて">商品名: すべて</option>
                </select>
                <select id="filter-special" onchange="renderAll()">
                    <option value="すべて">特殊条件: すべて</option>
                    <option value="長期">長期</option>
                    <option value="予約品">予約品</option>
                    <option value="再交換">再交換</option>
                    <option value="友人分">友人分</option>
                    <option value="買取">買取/譲渡</option>
                </select>
                <select id="filter-status" onchange="renderAll()">
                    <option value="すべて">ステータス: すべて</option>
                </select>
            </div>
        </div>

        <!-- 共通新規/編集フォーム -->
        <div id="trade-form" class="form-box" style="display: none;">
            <h3 id="form-mode-title" style="color:var(--main-color); font-size:15px; margin-bottom:10px;">新規取引を登録</h3>
            <input type="hidden" id="edit-trade-id" value="">
            
            <div id="category-form-section">
                <div class="form-section-title">取引区分</div>
                <select id="trade-category" onchange="onCategoryChange()">
                    <option value="交換">交換</option>
                    <option value="買取">買取</option>
                    <option value="譲渡">譲渡</option>
                </select>
            </div>

            <div class="form-section-title">ジャンル</div>
            <input type="text" id="input-genre" list="genre-suggestions" placeholder="ジャンル名を入力（未入力でもOK）">
            <datalist id="genre-suggestions"></datalist>

            <div id="stock-form-section" style="display:none;">
                <div class="form-section-title">商品名</div>
                <input type="text" id="stock-product-name" placeholder="商品名を入力" list="product-suggestions">
                
                <div class="form-section-title">種類</div>
                <input type="text" id="stock-product-type" placeholder="種類/キャラを入力">

                <div class="form-section-title">数量</div>
                <input type="number" id="stock-count" value="1" min="0" oninput="checkStockCountInput()">

                <div class="form-section-title">集計への反映</div>
                <select id="stock-summary-flag">
                    <option value="あり">あり</option>
                    <option value="なし">なし</option>
                </select>
            </div>

            <div id="normal-trade-form-section">
                <div class="form-section-title">取引相手の情報</div>
                <input type="text" id="p-id" placeholder="相手のTwitterIDなど">

                <div style="display:flex; gap:8px; align-items:center; margin-bottom:8px;">
                    <label style="font-size:12px; font-weight:bold; color:var(--main-color); white-space:nowrap;">期間種別:</label>
                    <select id="trade-term-type" onchange="toggleLongTermDate()" style="margin-bottom:0;">
                        <option value="通常">通常</option>
                        <option value="長期">長期</option>
                        <option value="予約品">予約品</option>
                    </select>
                </div>
                <div id="long-term-date-area" class="long-term-box" style="display:none;">
                    <label style="font-size:12px; font-weight:bold; color:var(--main-color); display:block; margin-bottom:4px;">発売日・購入予定日など</label>
                    <input type="date" id="long-term-date" style="margin-bottom:0;">
                </div>
                
                <div id="p-items-container"></div>
                <div class="row-btn-group">
                    <button type="button" class="sub-btn" onclick="addItemRow('p-items-container', 'partner')">＋ 行を追加</button>
                    <button type="button" class="del-row-btn" onclick="removeLastItemRow('p-items-container')">－ 行を削除</button>
                </div>

                <div id="my-items-form-section">
                    <div class="form-section-title">自分の取引メモ</div>
                    <div id="my-items-container"></div>
                    <div class="row-btn-group">
                        <button type="button" class="sub-btn" onclick="addItemRow('my-items-container', 'my')">＋ 行を追加</button>
                        <button type="button" class="del-row-btn" onclick="removeLastItemRow('my-items-container')">－ 行を削除</button>
                    </div>
                </div>
            </div>

            <div class="form-section-title">備考欄</div>
            <textarea id="trade-memo" rows="2"></textarea>

            <div class="form-section-title">ステータス</div>
            <select id="my-status">
                <option value="リプ済">リプ済</option>
                <option value="検討中">検討中</option>
                <option value="成立">
