<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>取引管理</title>
    <style>
        :root {
            --bg-color: #FAF4F7;
            --main-color: #B4495B;
            --main-light: #f3dce0;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e0b8c0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 12px; padding-bottom: 60px; }

        /* パスワード画面 */
        #auth-screen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 85vh; text-align: center;
        }
        #auth-screen h1 { color: var(--main-color); font-size: 28px; margin-bottom: 8px; }
        #auth-screen p { font-size: 13px; color: #666; margin-bottom: 20px; }
        #auth-screen input {
            padding: 12px; font-size: 16px; border: 2px solid var(--main-color);
            border-radius: 8px; margin-bottom: 12px; width: 85%; max-width: 300px; text-align: center; background: #fff;
        }
        #auth-screen button {
            background: var(--main-color); color: white; border: none; padding: 12px 30px;
            font-size: 16px; border-radius: 8px; font-weight: bold; cursor: pointer;
        }

        /* メイン画面 */
        #app-screen { display: none; max-width: 600px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px solid var(--main-color); padding-bottom: 8px; flex-wrap: wrap; gap: 6px; }
        .header-title-area { display: flex; align-items: baseline; gap: 8px; }
        header h1 { color: var(--main-color); font-size: 20px; letter-spacing: 0.5px; }
        .header-credit { font-size: 11px; color: var(--main-color); font-weight: bold; }
        .header-btns { display: flex; gap: 4px; flex-wrap: wrap; }
        .header-btns button { background: none; border: 1px solid var(--main-color); color: var(--main-color); padding: 4px 6px; border-radius: 6px; font-size: 10px; font-weight: bold; cursor: pointer; }

        /* フィルター */
        .filter-container { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
        .filter-container select, .search-box input { width: 100%; padding: 8px 10px; border: 1.5px solid var(--main-color); border-radius: 8px; font-size: 13px; background: #fff; margin-bottom: 0; }
        .filter-container select { flex: 1; min-width: 100px; }
        .search-box { margin-bottom: 12px; }

        /* タブ */
        .tabs { display: flex; gap: 6px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 4px; }
        .tab-btn {
            background: #fff; border: 1.5px solid var(--main-color); color: var(--main-color);
            padding: 8px 12px; border-radius: 20px; font-size: 13px; white-space: nowrap; font-weight: bold; cursor: pointer;
        }
        .tab-btn.active { background: var(--main-color); color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* ボタン共通 */
        .primary-btn {
            background: var(--main-color); color: white; border: none; width: 100%;
            padding: 12px; border-radius: 8px; font-size: 15px; font-weight: bold; margin-bottom: 15px; cursor: pointer;
        }
        .sub-btn {
            background: var(--main-light); color: var(--main-color); border: 1px solid var(--main-color);
            padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer;
        }
        .del-row-btn {
            background: #f5f5f5; color: #666; border: 1px solid #ccc;
            padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer;
        }
        .row-btn-group { display: flex; gap: 6px; margin-bottom: 10px; }
        .copy-btn {
            background: var(--main-light); color: var(--main-color); border: 1px solid var(--main-color);
            padding: 6px 12px; border-radius: 6px; font-size: 16px; cursor: pointer;
        }

        /* フォーム */
        .form-box { background: #fff; border: 2px solid var(--main-color); border-radius: 12px; padding: 14px; margin-bottom: 16px; }
        .form-section-title { font-size: 13px; font-weight: bold; color: var(--main-color); margin: 12px 0 6px; border-left: 4px solid var(--main-color); padding-left: 6px; }
        input[type="text"], input[type="number"], input[type="date"], select, textarea {
            width: 100%; padding: 8px 10px; margin-bottom: 8px; border: 1px solid var(--border-color);
            border-radius: 6px; font-size: 14px; background: #fff;
        }
        
        /* 行のレイアウト */
        .item-row { display: flex; gap: 4px; margin-bottom: 8px; align-items: flex-start; flex-wrap: wrap; background: #fdf8fa; padding: 6px; border-radius: 8px; border: 1px solid #f0d5dc; }
        .item-col-name { flex: 2; min-width: 110px; }
        .item-col-type { flex: 1; min-width: 70px; }
        .item-col-count { flex: 0.5; min-width: 45px; }
        .item-col-reex { flex: 1.1; min-width: 90px; }
        .item-row select, .item-row input { margin-bottom: 0; font-size: 12px; padding: 6px 4px; }

        .long-term-box { background: #fff5f7; border: 1.5px dashed var(--main-color); padding: 8px; border-radius: 8px; margin-bottom: 8px; }

        /* 取引カード */
        .trade-card {
            background: var(--card-bg); border: 1.5px solid var(--border-color); border-radius: 12px;
            padding: 12px; margin-bottom: 14px; box-shadow: 0 2px 6px rgba(180, 73, 91, 0.08);
        }
        .card-top-meta { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #777; margin-bottom: 8px; }
        .badge-container { display: flex; gap: 4px; }
        .badge-long { background: var(--main-color); color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .badge-buy { background: #8A5A68; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .badge-exchange { background: #688A5A; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .badge-calling { background: #D98880; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .badge-stock { background: #5A8A68; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        
        .partner-area { background: #fdf8fa; border: 1px solid #f0d5dc; border-radius: 8px; padding: 10px; margin-bottom: 8px; }
        .partner-id { font-weight: bold; font-size: 14px; margin-bottom: 4px; color: #222; }
        .long-date-info { font-size: 12px; color: var(--main-color); font-weight: bold; margin-bottom: 4px; }
        
        .my-area { background: #fff; border: 1.5px solid var(--main-color); border-radius: 8px; padding: 10px; margin-bottom: 8px; }
        .my-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .status-select { width: auto; padding: 4px 8px; font-size: 12px; font-weight: bold; color: var(--main-color); border: 1.5px solid var(--main-color); border-radius: 6px; margin-bottom: 0; }

        .item-list-text { font-size: 13px; line-height: 1.5; }
        .memo-display { font-size: 12px; color: #555; background: #fafafa; padding: 6px 8px; border-radius: 6px; margin-top: 6px; border: 1px dashed #ccc; }
        
        .card-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
        .action-link-btn { background: none; border: none; color: var(--main-color); font-size: 12px; text-decoration: underline; cursor: pointer; font-weight: bold; }
        .del-btn { background: none; border: none; color: #999; font-size: 11px; text-decoration: underline; cursor: pointer; }

        .option-toggle-area { margin-bottom: 12px; font-size: 13px; display: flex; align-items: center; gap: 6px; background: #fff; padding: 8px 12px; border-radius: 8px; border: 1.5px solid var(--border-color); }

        /* 集計 */
        .summary-controls { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
        .summary-controls select { flex: 1; min-width: 100px; font-size: 13px; font-weight: bold; color: var(--main-color); border: 1.5px solid var(--main-color); margin-bottom: 0; padding: 8px 10px; border-radius: 8px; background: #fff; }
        .summary-card { background: #fff; border-radius: 10px; padding: 12px; margin-bottom: 12px; border: 1px solid var(--border-color); }
        .summary-major { font-weight: bold; color: var(--main-color); font-size: 15px; border-bottom: 1px solid #eee; padding-bottom: 4px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
        .summary-genre-label { font-size: 11px; background: var(--main-light); color: var(--main-color); padding: 2px 6px; border-radius: 4px; font-weight: normal; }
        .summary-minor { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; }

        /* 定型文 */
        .template-card { background: #fff; border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
        .template-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .template-title { font-weight: bold; font-size: 14px; color: var(--main-color); }
        .template-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; background: var(--main-light); color: var(--main-color); }
        .template-body { font-size: 13px; white-space: pre-wrap; background: #fafafa; padding: 8px; border-radius: 6px; margin-bottom: 8px; border: 1px solid #eee; }
        .char-count { font-size: 11px; color: #666; text-align: right; margin-top: -4px; margin-bottom: 6px; }
        .char-count.over { color: red; font-weight: bold; }
    </style>
</head>
<body>

    <!-- パスワード認証画面 -->
    <div id="auth-screen">
        <h1>取引管理</h1>
        <p>パスワードを入力してください</p>
        <input type="password" id="pass-input" placeholder="パスワードを入力">
        <button id="login-btn">ログイン</button>
        <p id="error-msg" style="color: #B4495B; font-size: 12px; margin-top: 10px;"></p>
    </div>

    <!-- メインアプリ画面 -->
    <div id="app-screen">
        <header>
            <div class="header-title-area">
                <h1>取引管理</h1>
                <span class="header-credit">制作:みけ@mknk16n</span>
            </div>
            <div class="header-btns">
                <button onclick="exportData()" style="background:var(--main-light); font-weight:bold;">💾 バックアップ</button>
                <button onclick="triggerImport()" style="background:#e0ecf3; color:#336699; border-color:#336699; font-weight:bold;">📂 復元</button>
                <input type="file" id="import-file-input" style="display:none;" accept=".json" onchange="importData(event)">
                <button onclick="changePass()">PW変更</button>
                <button onclick="logout()">ログアウト</button>
            </div>
        </header>

        <!-- タブ切り替え -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('calling', this)">声掛中 <span id="count-calling" style="font-size:11px; opacity:0.8;">(0)</span></button>
            <button class="tab-btn" onclick="switchTab('active', this)">交換 <span id="count-active" style="font-size:11px; opacity:0.8;">(0)</span></button>
            <button class="tab-btn" onclick="switchTab('buy', this)">買取/譲渡 <span id="count-buy" style="font-size:11px; opacity:0.8;">(0)</span></button>
            <button class="tab-btn" onclick="switchTab('completed', this)">完了 <span id="count-completed" style="font-size:11px; opacity:0.8;">(0)</span></button>
            <button class="tab-btn" onclick="switchTab('stock', this)">在庫管理 <span id="count-stock" style="font-size:11px; opacity:0.8;">(0)</span></button>
            <button class="tab-btn" onclick="switchTab('summary', this)">集計</button>
            <button class="tab-btn" onclick="switchTab('templates', this)">定型文</button>
        </div>

        <!-- 共通検索・絞り込みエリア -->
        <div id="common-filter-area">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="🔍 検索..." oninput="renderAll()">
            </div>
            <div class="filter-container">
                <select id="filter-genre" onchange="onGenreFilterChange()">
                    <option value="すべて">ジャンル: すべて</option>
                </select>
                <select id="filter-product" onchange="renderAll()">
                    <option value="すべて">商品名: すべて</option>
                </select>
                <select id="filter-special" onchange="renderAll()">
                    <option value="すべて">特殊条件: すべて</option>
                    <option value="長期">長期</option>
                    <option value="予約品">予約品</option>
                    <option value="再交換">再交換</option>
                    <option value="友人分">友人分</option>
                    <option value="買取">買取/譲渡</option>
                </select>
                <select id="filter-status" onchange="renderAll()">
                    <option value="すべて">ステータス: すべて</option>
                </select>
            </div>
        </div>

        <!-- 共通新規/編集フォーム -->
        <div id="trade-form" class="form-box" style="display: none;">
            <h3 id="form-mode-title" style="color:var(--main-color); font-size:15px; margin-bottom:10px;">新規取引を登録</h3>
            <input type="hidden" id="edit-trade-id" value="">
            
            <div id="category-form-section">
                <div class="form-section-title">取引区分</div>
                <select id="trade-category" onchange="onCategoryChange()">
                    <option value="交換">交換</option>
                    <option value="買取">買取</option>
                    <option value="譲渡">譲渡</option>
                </select>
            </div>

            <div class="form-section-title">ジャンル</div>
            <input type="text" id="input-genre" list="genre-suggestions" placeholder="ジャンル名を入力（未入力でもOK）">
            <datalist id="genre-suggestions"></datalist>

            <div id="stock-form-section" style="display:none;">
                <div class="form-section-title">商品名</div>
                <input type="text" id="stock-product-name" placeholder="商品名を入力" list="product-suggestions">
                
                <div class="form-section-title">種類</div>
                <input type="text" id="stock-product-type" placeholder="種類/キャラを入力">

                <div class="form-section-title">数量</div>
                <input type="number" id="stock-count" value="1" min="0" oninput="checkStockCountInput()">

                <div class="form-section-title">集計への反映</div>
                <select id="stock-summary-flag">
                    <option value="あり">あり</option>
                    <option value="なし">なし</option>
                </select>
            </div>

            <div id="normal-trade-form-section">
                <div class="form-section-title">取引相手の情報</div>
                <input type="text" id="p-id" placeholder="相手のTwitterIDなど">

                <div style="display:flex; gap:8px; align-items:center; margin-bottom:8px;">
                    <label style="font-size:12px; font-weight:bold; color:var(--main-color); white-space:nowrap;">期間種別:</label>
                    <select id="trade-term-type" onchange="toggleLongTermDate()" style="margin-bottom:0;">
                        <option value="通常">通常</option>
                        <option value="長期">長期</option>
                        <option value="予約品">予約品</option>
                    </select>
                </div>
                <div id="long-term-date-area" class="long-term-box" style="display:none;">
                    <label style="font-size:12px; font-weight:bold; color:var(--main-color); display:block; margin-bottom:4px;">発売日・購入予定日など</label>
                    <input type="date" id="long-term-date" style="margin-bottom:0;">
                </div>
                
                <div id="p-items-container"></div>
                <div class="row-btn-group">
                    <button type="button" class="sub-btn" onclick="addItemRow('p-items-container', 'partner')">＋ 行を追加</button>
                    <button type="button" class="del-row-btn" onclick="removeLastItemRow('p-items-container')">－ 行を削除</button>
                </div>

                <div id="my-items-form-section">
                    <div class="form-section-title">自分の取引メモ</div>
                    <div id="my-items-container"></div>
                    <div class="row-btn-group">
                        <button type="button" class="sub-btn" onclick="addItemRow('my-items-container', 'my')">＋ 行を追加</button>
                        <button type="button" class="del-row-btn" onclick="removeLastItemRow('my-items-container')">－ 行を削除</button>
                    </div>
                </div>
            </div>

            <div class="form-section-title">備考欄</div>
            <textarea id="trade-memo" rows="2"></textarea>

            <div class="form-section-title">ステータス</div>
            <select id="my-status">
                <option value="リプ済">リプ済</option>
                <option value="検討中">検討中</option>
                <option value="成立">成立</option>
                <option value="不成立">不成立</option>
            </select>

            <div style="display:flex; gap:8px; margin-top: 10px;">
                <button class="primary-btn" onclick="saveTrade()" style="margin-bottom:0; flex:2;">保存する</button>
                <button type="button" class="sub-btn" onclick="toggleForm()" style="flex:1; background:#eee; color:#333; border:none;">キャンセル</button>
            </div>
        </div>

        <!-- タブ0：声掛中一覧 -->
        <div id="tab-calling" class="tab-content active">
            <button class="primary-btn" onclick="openAddForm('交換', 'calling')">＋ 新しい内容を登録する</button>
            <div id="calling-trade-list"></div>
        </div>

        <!-- タブ1：取引中一覧 -->
        <div id="tab-active" class="tab-content">
            <button class="primary-btn" onclick="openAddForm('交換', 'active')">＋ 新しい取引を登録する</button>
            <div id="active-trade-list"></div>
        </div>

        <!-- タブ2：買取/譲渡一覧 -->
        <div id="tab-buy" class="tab-content">
            <button class="primary-btn" onclick="openAddForm('買取', 'buy')">＋ 新しい買取・譲渡を登録する</button>
            <div id="buy-trade-list"></div>
        </div>

        <!-- タブ3：完了 -->
        <div id="tab-completed" class="tab-content">
            <div id="completed-trade-list"></div>
        </div>

        <!-- タブ4：在庫管理 -->
        <div id="tab-stock" class="tab-content">
            <button class="primary-btn" onclick="openAddForm('在庫', 'stock')">＋ 新しい在庫を登録する</button>
            <div class="option-toggle-area">
                <input type="checkbox" id="stock-show-zero" onchange="renderAll()">
                <label for="stock-show-zero" style="cursor:pointer;">在庫0のものを表示</label>
            </div>
            <div id="stock-trade-list"></div>
        </div>

        <!-- タブ5：集計 -->
        <div id="tab-summary" class="tab-content">
            <div class="search-box">
                <input type="text" id="summary-search-input" placeholder="🔍 検索..." oninput="renderSummary()">
            </div>
            <div class="summary-controls">
                <select id="summary-genre" onchange="onSummaryGenreChange()">
                    <option value="すべて">ジャンル: すべて</option>
                </select>
                <select id="summary-product" onchange="renderSummary()">
                    <option value="すべて">商品名: すべて</option>
                </select>
                <select id="summary-special" onchange="renderSummary()">
                    <option value="すべて">特殊条件: すべて</option>
                    <option value="長期">長期</option>
                    <option value="予約品">予約品</option>
                    <option value="再交換">再交換</option>
                    <option value="友人分">友人分</option>
                    <option value="買取">買取/譲渡</option>
                </select>
                <select id="summary-sort" onchange="renderSummary()">
                    <option value="count-desc">並び替え: 枚数（多い順）</option>
                    <option value="count-asc">並び替え: 枚数（少ない順）</option>
                    <option value="date-desc">並び替え: 日付順（新しい順）</option>
                    <option value="date-asc">並び替え: 日付順（古い順）</option>
                </select>
            </div>
            <div class="option-toggle-area">
                <input type="checkbox" id="summary-show-zero" onchange="renderSummary()">
                <label for="summary-show-zero" style="cursor:pointer;">枚数0のものを表示</label>
            </div>
            <div id="summary-container"></div>
        </div>

        <!-- タブ6：定型文リスト -->
        <div id="tab-templates" class="tab-content">
            <div class="form-box">
                <div class="form-section-title">新しい定型文を追加</div>
                <input type="text" id="tpl-title" placeholder="タイトル">
                
                <label style="font-size:12px; font-weight:bold; color:var(--main-color);">種別</label>
                <select id="tpl-type" onchange="checkCharLimit()">
                    <option value="リプライ">リプライ (140字制限)</option>
                    <option value="dm">DM (制限なし)</option>
                </select>

                <textarea id="tpl-body" rows="4" placeholder="本文を入力してください" oninput="checkCharLimit()"></textarea>
                <div id="tpl-char-count" class="char-count">0 / 140文字</div>

                <button class="primary-btn" onclick="addTemplate()" style="margin-bottom: 0;">定型文を保存</button>
            </div>
            
            <div id="template-list"></div>
        </div>
    </div>

    <datalist id="product-suggestions"></datalist>

    <script>
        function safeStr(val) {
            return String(val ?? "");
        }

        function safeLower(val) {
            return safeStr(val).toLowerCase();
        }

        function safeNum(val, fallback = 0) {
            const n = Number(val);
            return Number.isFinite(n) ? n : fallback;
        }

        function safeArray(val) {
            return Array.isArray(val) ? val : [];
        }

        let allowedUsers = JSON.parse(localStorage.getItem('torihiki_mk_users') || 'null') || {
            "mike1234": "user_mike",
            "nini1234": "user_nini",
            "chun1234": "user_chun",
            "friend1": "user_friend1",
            "friend2": "user_friend2"
        };

        let currentUserKey = "";
        let trades = [];
        let templates = [];
        let currentTabContext = "calling";

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("login-btn").addEventListener("click", login);
            checkCharLimit();
        });

        function exportData() {
            if (!currentUserKey) return alert("ログインしていません");
            const dataToExport = {
                trades: trades,
                templates: templates,
                userKey: currentUserKey
            };
            const blob = new Blob([JSON.stringify(dataToExport, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            const dateStr = new Date().toISOString().slice(0, 10).replace(/-/g, "");
            a.href = url;
            a.download = `torihiki_backup_${dateStr}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function triggerImport() {
            if (!currentUserKey) return alert("ログインしていません");
            if (confirm("バックアップファイルを読み込むと、現在のデータがファイル内のデータに上書きされます。よろしいですか？")) {
                document.getElementById("import-file-input").click();
            }
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported && Array.isArray(imported.trades) && Array.isArray(imported.templates)) {
                        trades = imported.trades;
                        templates = imported.templates;
                        saveUserData();
                        renderAll();
                        alert("データを正常に復元しました！");
                    } else {
                        alert("ファイルの形式が正しくありません。");
                    }
                } catch (err) {
                    alert("ファイルの読み込みに失敗しました。");
                }
                event.target.value = "";
            };
            reader.readAsText(file);
        }

        function login() {
            const pass = document.getElementById("pass-input").value.trim();
            if (allowedUsers[pass]) {
                currentUserKey = allowedUsers[pass];
                loadUserData();
                document.getElementById("auth-screen").style.display = "none";
                document.getElementById("app-screen").style.display = "block";
                updateStatusFilterDropdown(currentTabContext);
                renderAll();
            } else {
                document.getElementById("error-msg").textContent = "パスワードが登録されていません";
            }
        }

        function logout() {
            currentUserKey = "";
            document.getElementById("pass-input").value = "";
            document.getElementById("app-screen").style.display = "none";
            document.getElementById("auth-screen").style.display = "flex";
        }

        function changePass() {
            const newPass = prompt("新しいパスワードを入力してください：");
            if (!newPass || !newPass.trim()) return;
            const trimmed = newPass.trim();
            if (allowedUsers[trimmed]) {
                alert("そのパスワードはすでに使われています。");
                return;
            }
            for (let k in allowedUsers) {
                if (allowedUsers[k] === currentUserKey) delete allowedUsers[k];
            }
            allowedUsers[trimmed] = currentUserKey;
            localStorage.setItem('torihiki_mk_users', JSON.stringify(allowedUsers));
            alert("パスワードを登録しました！");
        }

        function loadUserData() {
            try {
                const rawTrades = JSON.parse(localStorage.getItem(currentUserKey + '_trades') || '[]');
                trades = Array.isArray(rawTrades) ? rawTrades.filter(t => t && typeof t === "object") : [];
            } catch (e) {
                trades = [];
            }
            try {
                const rawTemplates = JSON.parse(localStorage.getItem(currentUserKey + '_templates') || 'null');
                templates = Array.isArray(rawTemplates) ? rawTemplates.filter(t => t && typeof t === "object") : [
                    { id: 1, title: "お声がけ用", type: "リプライ", body: "初めまして、検索より失礼します。当方の〇〇と交換可能でしょうか？" }
                ];
            } catch (e) {
                templates = [
                    { id: 1, title: "お声がけ用", type: "リプライ", body: "初めまして、検索より失礼します。当方の〇〇と交換可能でしょうか？" }
                ];
            }
            updateProductSuggestionsList();
        }

        function saveUserData() {
            localStorage.setItem(currentUserKey + '_trades', JSON.stringify(trades));
            localStorage.setItem(currentUserKey + '_templates', JSON.stringify(templates));
            updateProductSuggestionsList();
        }

        function updateProductSuggestionsList() {
            const names = new Set();
            safeArray(trades).forEach(t => {
                if (!t) return;
                if (t.isStock && safeStr(t.stockName).trim()) names.add(safeStr(t.stockName).trim());
                safeArray(t.partnerItems).forEach(i => { if (i && safeStr(i.name).trim()) names.add(safeStr(i.name).trim()); });
                safeArray(t.myItems).forEach(i => { if (i && safeStr(i.name).trim()) names.add(safeStr(i.name).trim()); });
            });
            const datalist = document.getElementById("product-suggestions");
            datalist.innerHTML = Array.from(names).map(n => `<option value="${safeStr(n).replace(/"/g, '"')}">`).join("");
        }

        function duplicateTrade(id) {
            const t = trades.find(item => item && item.id === id);
            if (!t) return;

            if (t.isStock) {
                currentTabContext = "stock";
                document.getElementById("edit-trade-id").value = "";
                document.getElementById("category-form-section").style.display = "none";
                document.getElementById("stock-form-section").style.display = "block";
                document.getElementById("normal-trade-form-section").style.display = "none";
                document.getElementById("form-mode-title").textContent = "新しい在庫を登録（コピー）";
                
                document.getElementById("input-genre").value = t.genre === "未分類" ? "" : safeStr(t.genre);
                document.getElementById("stock-product-name").value = safeStr(t.stockName);
                document.getElementById("stock-product-type").value = safeStr(t.stockType);
                document.getElementById("stock-count").value = safeNum(t.stockCount, 1);
                document.getElementById("stock-summary-flag").value = t.summaryFlag || "あり";
                document.getElementById("trade-memo").value = safeStr(t.memo);
                updateFormStatusOptions("在庫", t.status || "在庫", "stock");
            } else {
                const category = t.category || "交換";
                const isBuyItem = category === "買取" || category === "譲渡";
                const isCallingItem = ["リプ済", "検討中", "お声がけ中"].includes(t.status);
                
                if (isCallingItem) {
                    currentTabContext = "calling";
                } else if (isBuyItem) {
                    currentTabContext = "buy";
                } else {
                    currentTabContext = "active";
                }
                
                document.getElementById("edit-trade-id").value = ""; 
                
                document.getElementById("category-form-section").style.display = "block";
                document.getElementById("stock-form-section").style.display = "none";
                document.getElementById("normal-trade-form-section").style.display = "block";
                document.getElementById("form-mode-title").textContent = "新規取引を登録（コピー）";
                
                updateCategoryDropdown(currentTabContext);
                document.getElementById("trade-category").value = category;

                document.getElementById("input-genre").value = t.genre === "未分類" ? "" : safeStr(t.genre);
                document.getElementById("p-id").value = ""; 
                document.getElementById("trade-term-type").value = t.termType || "通常";
                document.getElementById("long-term-date").value = safeStr(t.longDate);
                toggleLongTermDate();
                document.getElementById("trade-memo").value = safeStr(t.memo);

                onCategoryChange();
                updateFormStatusOptions(category, t.status || (isCallingItem ? "リプ済" : (isBuyItem ? "支払い待ち" : "初回連絡済")), currentTabContext);

                const pContainer = document.getElementById("p-items-container");
                pContainer.innerHTML = "";
                const pList = safeArray(t.partnerItems);
                if (pList.length > 0) {
                    pList.forEach(i => addItemRow("p-items-container", "partner", i && i.name, i && i.type, i && i.count, (i && i.reex) || "オフ"));
                } else {
                    addItemRow("p-items-container", "partner");
                }

                const myContainer = document.getElementById("my-items-container");
                myContainer.innerHTML = "";
                if (category === "買取" || category === "譲渡") {
                    addItemRow("my-items-container", "my");
                } else {
                    const mList = safeArray(t.myItems);
                    if (mList.length > 0) {
                        mList.forEach(i => addItemRow("my-items-container", "my", i && i.name, i && i.type, i && i.count));
                    } else {
                        addItemRow("my-items-container", "my");
                    }
                }
            }

            updateGenreSuggestions();
            document.getElementById("trade-form").style.display = "block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updateGenreSuggestions() {
            const genres = new Set();
            safeArray(trades).forEach(t => {
                const g = safeStr(t && t.genre).trim();
                if (g && g !== "未分類") genres.add(g);
            });
            document.getElementById("genre-suggestions").innerHTML = Array.from(genres).map(g => `<option value="${g.replace(/"/g, '"')}">`).join("");
        }

        function extractItemsFromContainer(containerId, rowType) {
            const rows = document.querySelectorAll(`#${containerId} .item-row`);
            const items = [];
            rows.forEach(row => {
                const name = safeStr(row.querySelector(".name-input")?.value).trim() || "未設定";
                const type = safeStr(row.querySelector(".type-input")?.value).trim() || "-";
                const count = Math.max(1, safeNum(row.querySelector(".count-input")?.value, 1));
                
                let reex = "オフ";
                if (rowType === "partner") {
                    const reexSelect = row.querySelector(".reex-select");
                    reex = reexSelect ? safeStr(reexSelect.value) : "オフ";
                }

                items.push({ name, type, count, reex });
            });
            return items;
        }

        function isFinishedStatus(status) {
            return status === "取引終了" || status === "完了" || status === "不成立";
        }

        function saveTrade() {
            const editId = document.getElementById("edit-trade-id").value;
            const genre = safeStr(document.getElementById("input-genre").value).trim() || "未分類";
            const memo = safeStr(document.getElementById("trade-memo").value).trim();
            const now = new Date();
            const dateStr = `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()}`;

            if (currentTabContext === "stock") {
                const stockName = safeStr(document.getElementById("stock-product-name").value).trim() || "未設定";
                const stockType = safeStr(document.getElementById("stock-product-type").value).trim() || "-";
                const stockCount = Math.max(0, safeNum(document.getElementById("stock-count").value, 0));
                const summaryFlag = document.getElementById("stock-summary-flag").value;
                
                let status = document.getElementById("my-status").value;
                if (stockCount === 0) {
                    status = "取引済";
                }

                if (editId) {
                    const t = trades.find(item => item && String(item.id) === String(editId));
                    if (t) {
                        t.genre = genre;
                        t.stockName = stockName;
                        t.stockType = stockType;
                        t.stockCount = stockCount;
                        t.summaryFlag = summaryFlag;
                        t.status = status;
                        t.memo = memo;
                    }
                } else {
                    trades.unshift({
                        id: Date.now(),
                        timestamp: Date.now(),
                        isStock: true,
                        date: dateStr,
                        genre: genre,
                        stockName: stockName,
                        stockType: stockType,
                        stockCount: stockCount,
                        summaryFlag: summaryFlag,
                        memo: memo,
                        status: status
                    });
                }
            } else {
                let category = document.getElementById("trade-category").value || "交換";
                if (currentTabContext !== "calling" && currentTabContext !== "buy" && !editId) {
                    category = "交換";
                }

                const pId = safeStr(document.getElementById("p-id").value).trim() || "未入力";
                const termType = document.getElementById("trade-term-type").value;
                const longDate = termType === "長期" ? document.getElementById("long-term-date").value : "";
                let status = document.getElementById("my-status").value;

                if (status === "成立") {
                    if (category === "買取" || category === "譲渡") {
                        status = "支払い済";
                    } else {
                        status = "初回連絡済";
                    }
                }

                const partnerItems = extractItemsFromContainer("p-items-container", "partner");
                const myItems = (category === "買取" || category === "譲渡") ? [] : extractItemsFromContainer("my-items-container", "my");
                const isFinished = isFinishedStatus(status);

                if (editId) {
                    const t = trades.find(item => item && String(item.id) === String(editId));
                    if (t) {
                        t.isStock = false;
                        t.category = category;
                        t.genre = genre;
                        t.partnerId = pId;
                        t.termType = termType;
                        t.longDate = longDate;
                        t.partnerItems = partnerItems;
                        t.myItems = myItems;
                        t.memo = memo;
                        
                        if (isFinished && !t.completedDate) {
                            t.completedDate = dateStr;
                        } else if (!isFinished) {
                            t.completedDate = "";
                        }
                        t.status = status;
                    }
                } else {
                    let completedDateStr = isFinished ? dateStr : "";
                    trades.unshift({
                        id: Date.now(),
                        timestamp: Date.now(),
                        isStock: false,
                        category: category,
                        date: dateStr,
                        completedDate: completedDateStr,
                        genre: genre,
                        partnerId: pId,
                        termType: termType,
                        longDate: longDate,
                        partnerItems: partnerItems,
                        myItems: myItems,
                        memo: memo,
                        status: status
                    });
                }
            }

            saveUserData();
            toggleForm();
            renderAll();
        }

        function editTrade(id) {
            const t = trades.find(item => item && item.id === id);
            if (!t) return;

            if (t.isStock) {
                currentTabContext = "stock";
                document.getElementById("edit-trade-id").value = t.id;
                document.getElementById("category-form-section").style.display = "none";
                document.getElementById("stock-form-section").style.display = "block";
                document.getElementById("normal-trade-form-section").style.display = "none";
                document.getElementById("form-mode-title").textContent = "在庫データを編集";
                document.getElementById("input-genre").value = t.genre === "未分類" ? "" : safeStr(t.genre);
                document.getElementById("stock-product-name").value = safeStr(t.stockName);
                document.getElementById("stock-product-type").value = safeStr(t.stockType);
                document.getElementById("stock-count").value = safeNum(t.stockCount, 0);
                document.getElementById("stock-summary-flag").value = t.summaryFlag || "あり";
                document.getElementById("trade-memo").value = safeStr(t.memo);
                updateFormStatusOptions("在庫", t.status || "在庫", "stock");
            } else {
                const isCallingItem = ["リプ済", "検討中", "お声がけ中"].includes(t.status);
                const isBuyItem = t.category === "買取" || t.category === "譲渡";
                currentTabContext = isCallingItem ? "calling" : (isBuyItem ? "buy" : "active");

        function updateStatus(id, newStatus) {
            const t = trades.find(item => item && item.id === id);
            if (t) {
                if (newStatus === "成立") {
                    if (t.category === "買取" || t.category === "譲渡") {
                        t.status = "支払い済";
                    } else {
                        t.status = "初回連絡済";
                    }
                } else if (newStatus === "不成立") {
                    t.status = "不成立";
                } else {
                    t.status = newStatus;
                }

                const now = new Date();
                const dateStr = `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()}`;
                const isFinished = isFinishedStatus(t.status);
                
                if (isFinished && !t.completedDate) {
                    t.completedDate = dateStr;
                } else if (!isFinished) {
                    t.completedDate = "";
                }
                saveUserData();
                renderAll();
            }
        }

        function deleteTrade(id) {
            if (!confirm("このデータを削除しますか？")) return;
            trades = trades.filter(item => item && item.id !== id);
            saveUserData();
            renderAll();
        }

            updateProductFilterDropdown();
            renderAll();

            updateSummaryProductFilterDropdown();

        function updateProductFilterDropdown() {
            const genreSelect = document.getElementById("filter-genre");
            const productSelect = document.getElementById("filter-product");
            const selectedGenre = safeStr(genreSelect.value);
            const currentProduct = safeStr(productSelect.value);

            const products = new Set();
            safeArray(trades).forEach(t => {
                if (!t) return;
                const g = safeStr(t.genre).trim() || "未分類";
                if (selectedGenre === "すべて" || g === selectedGenre) {
                    if (t.isStock && safeStr(t.stockName).trim()) products.add(safeStr(t.stockName).trim());
                    safeArray(t.partnerItems).forEach(i => { if (i && safeStr(i.name).trim()) products.add(safeStr(i.name).trim()); });
                    safeArray(t.myItems).forEach(i => { if (i && safeStr(i.name).trim()) products.add(safeStr(i.name).trim()); });
                }
            });

            productSelect.innerHTML = `<option value="すべて">商品名: すべて</option>`;
            Array.from(products).forEach(p => {
                productSelect.innerHTML += `<option value="${p.replace(/"/g, '"')}" ${p === currentProduct ? 'selected' : ''}>商品名: ${p}</option>`;
            });
            if (!products.has(currentProduct) && currentProduct !== "すべて") {
                productSelect.value = "すべて";
            }
        }

                    const tGenre = safeStr(t.genre).trim() || "未分類";

                    if ((selectedSpecial === "再交換" || selectedSpecial === "友人分") && t.isStock) return false;

                    if (searchQuery !== "") {
                        let matched = false;
                        if (t.isStock) {
                            if (safeLower(t.stockName).trim() === searchQuery) matched = true;
                            if (safeLower(t.stockType).trim() === searchQuery) matched = true;
                            if (safeLower(t.genre).trim() === searchQuery) matched = true;
                        } else {
                            const checkItems = [...pItems, ...mItems];
                            if (checkItems.some(i => i && (safeLower(i.name).trim() === searchQuery || safeLower(i.type).trim() === searchQuery))) {
                                matched = true;
                            }
                            if (safeLower(t.partnerId).trim() === searchQuery) matched = true;

                }).forEach(t => {
                    const tGenre = safeStr(t.genre).trim() || "未分類";
                    const ts = safeNum(t.timestamp, safeNum(t.id, 0));

                    const matchPartnerSpecial = (item) => {
                        if (!item) return false;
                        if (selectedSpecial === "再交換") return item.reex === "オン";
                        if (selectedSpecial === "友人分") return item.reex === "友人分";
                        return true;
                    };

                    const matchSearchQuery = (name, type) => {
                        if (searchQuery === "") return true;
                        return safeLower(name).trim() === searchQuery || safeLower(type).trim() === searchQuery;
                    };

                    if (t.isStock) {
                        if (t.summaryFlag !== "なし") {
                            const sName = safeStr(t.stockName).trim() || "未設定";
                            const sType = safeStr(t.stockType).trim() || "-";
                            if (selectedProduct !== "すべて" && sName !== selectedProduct) return;
                            if (!matchSearchQuery(sName, sType)) return;

                            const key = tGenre + "___" + sName + "___" + sType;

                            if (!summaryMap[key]) {
                                summaryMap[key] = {
                                    genre: tGenre,
                                    name: sName,
                                    type: sType,
                                    total: 0,
                                    latestTs: ts,
                                    earliestTs: ts
                                };
                            }
                            summaryMap[key].total += safeNum(t.stockCount, 0);
                            if (ts > summaryMap[key].latestTs) summaryMap[key].latestTs = ts;
                            if (ts < summaryMap[key].earliestTs) summaryMap[key].earliestTs = ts;
                        }
                    } else {
                        if (t.category === "交換") {
                            safeArray(t.partnerItems).forEach(item => {
                                if (!item) return;
                                const iName = safeStr(item.name).trim() || "未設定";
                                const iType = safeStr(item.type).trim() || "-";
                                if (selectedProduct !== "すべて" && iName !== selectedProduct) return;
                                if (!matchPartnerSpecial(item)) return;
                                if (!matchSearchQuery(iName, iType)) return;

                                const key = tGenre + "___" + iName + "___" + iType;
                                if (!summaryMap[key]) {
                                    summaryMap[key] = { genre: tGenre, name: iName, type: iType, total: 0, latestTs: ts, earliestTs: ts };
                                }
                                summaryMap[key].total += safeNum(item.count, 1);
                                if (ts > summaryMap[key].latestTs) summaryMap[key].latestTs = ts;
                                if (ts < summaryMap[key].earliestTs) summaryMap[key].earliestTs = ts;
                            });

                            if (selectedSpecial !== "再交換" && selectedSpecial !== "友人分") {
                                safeArray(t.myItems).forEach(item => {
                                    if (!item) return;
                                    const iName = safeStr(item.name).trim() || "未設定";
                                    const iType = safeStr(item.type).trim() || "-";
                                    if (selectedProduct !== "すべて" && iName !== selectedProduct) return;
                                    if (!matchSearchQuery(iName, iType)) return;

                                    const key = tGenre + "___" + iName + "___" + iType;
                                    if (!summaryMap[key]) {
                                        summaryMap[key] = { genre: tGenre, name: iName, type: iType, total: 0, latestTs: ts, earliestTs: ts };
                                    }
                                    summaryMap[key].total -= safeNum(item.count, 1);
                                    if (ts > summaryMap[key].latestTs) summaryMap[key].latestTs = ts;
                                    if (ts < summaryMap[key].earliestTs) summaryMap[key].earliestTs = ts;
                                });
                            }
                        }

                        if (t.category === "買取") {
                            safeArray(t.partnerItems).forEach(item => {
                                if (!item) return;
                                const iName = safeStr(item.name).trim() || "未設定";
                                const iType = safeStr(item.type).trim() || "-";
                                if (selectedProduct !== "すべて" && iName !== selectedProduct) return;
                                if (!matchPartnerSpecial(item)) return;
                                if (!matchSearchQuery(iName, iType)) return;

                                const key = tGenre + "___" + iName + "___" + iType;
                                if (!summaryMap[key]) {
                                    summaryMap[key] = { genre: tGenre, name: iName, type: iType, total: 0, latestTs: ts, earliestTs: ts };
                                }
                                summaryMap[key].total += safeNum(item.count, 1);
                                if (ts > summaryMap[key].latestTs) summaryMap[key].latestTs = ts;
                                if (ts < summaryMap[key].earliestTs) summaryMap[key].earliestTs = ts;
                            });
                        }

                        if (t.category === "譲渡") {
                            safeArray(t.partnerItems).forEach(item => {
                                if (!item) return;
                                const iName = safeStr(item.name).trim() || "未設定";
                                const iType = safeStr(item.type).trim() || "-";
                                if (selectedProduct !== "すべて" && iName !== selectedProduct) return;
                                if (!matchPartnerSpecial(item)) return;
                                if (!matchSearchQuery(iName, iType)) return;

                                const key = tGenre + "___" + iName + "___" + iType;
                                if (!summaryMap[key]) {
                                    summaryMap[key] = { genre: tGenre, name: iName, type: iType, total: 0, latestTs: ts, earliestTs: ts };
                                }
                                summaryMap[key].total -= safeNum(item.count, 1);
                                if (ts > summaryMap[key].latestTs) summaryMap[key].latestTs = ts;
                                if (ts < summaryMap[key].earliestTs) summaryMap[key].earliestTs = ts;
                            });
                        }
                    }
                });

                container.innerHTML = "";
                let entries = Object.values(summaryMap);

                if (!summaryShowZero) {
                    entries = entries.filter(data => safeNum(data.total, 0) !== 0);
                }

                if (entries.length === 0) {
                    container.innerHTML = "<p style='font-size:13px; color:#888; text-align:center; padding:20px;'>現在集計対象のデータがありません。</p>";
                    return;
                }

                const sortMode = document.getElementById("summary-sort").value;
                entries.sort((a, b) => {
                    if (sortMode === "count-desc") return safeNum(b.total, 0) - safeNum(a.total, 0);
                    if (sortMode === "count-asc") return safeNum(a.total, 0) - safeNum(b.total, 0);
                    if (sortMode === "date-desc") return safeNum(b.latestTs, 0) - safeNum(a.latestTs, 0);
                    if (sortMode === "date-asc") return safeNum(a.earliestTs, 0) - safeNum(b.earliestTs, 0);
                    return 0;
                });

                entries.forEach(data => {
                    container.innerHTML += `
                        <div class="summary-card">
                            <div class="summary-major">
                                <span>${safeStr(data.name)}</span>
                                <span class="summary-genre-label">${safeStr(data.genre)}</span>
                            </div>
                            <div class="summary-minor">
                                <span>・${safeStr(data.type)}</span>
                                <span>${safeNum(data.total, 0)} 枚</span>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("renderSummary error:", err);
                if (container) {
                    container.innerHTML = "<p style='font-size:13px; color:#888; text-align:center; padding:20px;'>集計表示中にエラーが発生しました。</p>";
                }
            }
        }

        function checkCharLimit() {
            const type = document.getElementById("tpl-type").value;
            const body = safeStr(document.getElementById("tpl-body").value);
            const countBox = document.getElementById("tpl-char-count");
            const len = body.length;

            if (type === "リプライ") {
                countBox.textContent = `${len} / 140文字`;
                if (len > 140) {
                    countBox.className = "char-count over";
                    countBox.textContent = `${len} / 140文字 (140字オーバーしています！)`;
                } else {
                    countBox.className = "char-count";
                }
            } else {
                countBox.textContent = `${len}文字 (DM制限なし)`;
                countBox.className = "char-count";
            }
        }

        function addTemplate() {
            const title = safeStr(document.getElementById("tpl-title").value).trim();
            const type = document.getElementById("tpl-type").value;
            const body = safeStr(document.getElementById("tpl-body").value).trim();
            if (!title || !body) return alert("タイトルと本文を入力してください");

            if (type === "リプライ" && body.length > 140) {
                if (!confirm("リプライの140字を超えていますが、このまま保存しますか？")) return;
            }

            templates.unshift({ id: Date.now(), title, type, body });
            saveUserData();
            document.getElementById("tpl-title").value = "";
            document.getElementById("tpl-body").value = "";
            checkCharLimit();
            renderTemplates();
        }

        function copyTemplate(text) {
            navigator.clipboard.writeText(safeStr(text)).then(() => {
                alert("定型文をコピーしました！");
            });
        }

        function deleteTemplate(id) {
            templates = templates.filter(t => t && t.id !== id);
            saveUserData();
            renderTemplates();
        }

        function renderTemplates() {
            const list = document.getElementById("template-list");
            list.innerHTML = "";
            safeArray(templates).forEach(t => {
                if (!t) return;
                const bodyStr = safeStr(t.body);
                const escapedText = bodyStr.replace(/\\/g, "\\\\").replace(/'/g, "\\'").replace(/\n/g, "\\n");
                list.innerHTML += `
                    <div class="template-card">
                        <div class="template-header-row">
                            <span class="template-title">${safeStr(t.title)}</span>
                            <span class="template-badge">${safeStr(t.type).toUpperCase()}</span>
                        </div>
                        <div class="template-body">${bodyStr}</div>
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <button class="copy-btn" onclick="copyTemplate('${escapedText}')">📋</button>
                            <button class="del-btn" onclick="deleteTemplate(${t.id})">削除</button>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
